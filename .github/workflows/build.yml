name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
